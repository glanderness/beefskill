<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Beef Content System 固定输出</title>
  <desc id="desc">一篇已有内容经过分析后，会得到内容资产、优先选题、三层延伸方向、内容系列和发布顺序。</desc>
  <rect width="1200" height="380" rx="28" fill="#F7F4EE"/>
  <text x="54" y="58" fill="#16191F" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="38" font-weight="760">一篇旧内容，会得到什么</text>
  <text x="54" y="91" fill="#68717D" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif" font-size="18">固定收敛，不用大量相似选题制造选择负担</text>

  <g transform="translate(54 128)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g>
      <rect width="202" height="190" rx="20" fill="#FFFFFF" stroke="#D9DCE2"/>
      <text x="20" y="31" fill="#FF8A91" font-size="16" font-weight="750">01 · CONTENT ASSETS</text>
      <text x="20" y="91" fill="#16191F" font-size="44" font-weight="780">5</text>
      <text x="58" y="91" fill="#16191F" font-size="22" font-weight="680">项资产</text>
      <text x="20" y="133" fill="#68717D" font-size="17">经历 · 决策 · 结果</text>
      <text x="20" y="160" fill="#68717D" font-size="17">只留值得延伸的部分</text>
    </g>

    <g transform="translate(222)">
      <rect width="202" height="190" rx="20" fill="#FFFFFF" stroke="#D9DCE2"/>
      <text x="20" y="31" fill="#79A5FF" font-size="16" font-weight="750">02 · PRIORITY</text>
      <text x="20" y="91" fill="#16191F" font-size="44" font-weight="780">3</text>
      <text x="58" y="91" fill="#16191F" font-size="22" font-weight="680">个优先选题</text>
      <text x="20" y="133" fill="#68717D" font-size="17">推荐理由</text>
      <text x="20" y="160" fill="#68717D" font-size="17">建议结构</text>
    </g>

    <g transform="translate(444)">
      <rect width="202" height="190" rx="20" fill="#FFFFFF" stroke="#9A78FF"/>
      <text x="20" y="31" fill="#BCA8FF" font-size="16" font-weight="750">03 · THREE LAYERS</text>
      <text x="20" y="91" fill="#16191F" font-size="42" font-weight="780">3×5</text>
      <text x="20" y="133" fill="#68717D" font-size="17">内容 · 方法 · 元方法</text>
      <text x="20" y="160" fill="#68717D" font-size="17">每层最多五个方向</text>
    </g>

    <g transform="translate(666)">
      <rect width="202" height="190" rx="20" fill="#FFFFFF" stroke="#D9DCE2"/>
      <text x="20" y="31" fill="#7DDBAE" font-size="16" font-weight="750">04 · SERIES</text>
      <text x="20" y="91" fill="#16191F" font-size="42" font-weight="780">1–2</text>
      <text x="20" y="133" fill="#68717D" font-size="17">条内容系列</text>
      <text x="20" y="160" fill="#68717D" font-size="17">每条最多五篇</text>
    </g>

    <g transform="translate(888)">
      <rect width="202" height="190" rx="20" fill="#FFFFFF" stroke="#D9DCE2"/>
      <text x="20" y="31" fill="#FFD479" font-size="16" font-weight="750">05 · SEQUENCE</text>
      <text x="20" y="91" fill="#16191F" font-size="44" font-weight="780">5</text>
      <text x="58" y="91" fill="#16191F" font-size="22" font-weight="680">步发布顺序</text>
      <text x="20" y="133" fill="#68717D" font-size="17">从为什么做到实际结果</text>
      <text x="20" y="160" fill="#68717D" font-size="17">直接决定下一篇</text>
    </g>
  </g>
</svg>
