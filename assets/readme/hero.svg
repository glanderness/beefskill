<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Beef Content System</title>
  <desc id="desc">把一篇已有内容沿内容、方法和元方法三层继续延伸，形成可以连续发布的系列选题。</desc>
  <defs>
    <linearGradient id="hero-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121418"/>
      <stop offset="1" stop-color="#1B1E25"/>
    </linearGradient>
    <linearGradient id="branch-flow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A64"/>
      <stop offset="0.52" stop-color="#9A78FF"/>
      <stop offset="1" stop-color="#3370FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#hero-bg)"/>
  <path d="M0 330 C225 275 360 410 595 333 C815 262 992 350 1200 292 L1200 420 L0 420 Z" fill="#FFFFFF" opacity="0.025"/>

  <g id="title-block" transform="translate(64 52)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <rect width="228" height="34" rx="17" fill="#FF5A64" opacity="0.14"/>
    <circle cx="20" cy="17" r="5" fill="#FF5A64"/>
    <text x="34" y="23" fill="#FF8A91" font-size="16" font-weight="700" letter-spacing="1.3">CODEX CONTENT SKILL</text>

    <text x="0" y="112" fill="#F8F6F2" font-size="51" font-weight="760">Beef Content System</text>
    <text x="0" y="160" fill="#F8F6F2" font-size="29" font-weight="650">让一篇内容，长出一整套系列选题</text>
    <text x="0" y="204" fill="#AEB6C2" font-size="21">内容层 · 方法层 · 元方法层 · 持续递归</text>

    <g transform="translate(0 248)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
      <rect width="488" height="56" rx="14" fill="#0B0D10" stroke="#323741"/>
      <circle cx="24" cy="28" r="6" fill="#FF5A64"/>
      <text x="44" y="35" fill="#E8EBF0" font-size="18">$beef-content-system 分析这篇内容</text>
      <path d="M446 23 L458 28 L446 33" fill="none" stroke="#3370FF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <g id="content-branches" transform="translate(668 36)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <path d="M200 204 C230 204 230 68 260 68 M200 204 H260 M200 204 C230 204 230 330 260 330" fill="none" stroke="url(#branch-flow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="200" cy="204" r="7" fill="#FF5A64"/>
    <circle cx="260" cy="68" r="6" fill="#FF5A64"/>
    <circle cx="260" cy="204" r="6" fill="#9A78FF"/>
    <circle cx="260" cy="330" r="6" fill="#3370FF"/>

    <g transform="translate(0 145)">
      <rect width="200" height="118" rx="20" fill="#20242C" stroke="#3A404B"/>
      <text x="22" y="31" fill="#929CAA" font-size="16" font-weight="700">已有内容</text>
      <text x="22" y="68" fill="#F4F5F7" font-size="23" font-weight="680">一次真实经历</text>
      <text x="22" y="96" fill="#929CAA" font-size="17">文章 · 推文 · 口播稿</text>
    </g>

    <g transform="translate(260 20)">
      <rect width="252" height="96" rx="18" fill="#20242C" stroke="#FF5A64"/>
      <text x="22" y="31" fill="#FF8A91" font-size="16" font-weight="750">01 · 内容层</text>
      <text x="22" y="64" fill="#F4F5F7" font-size="21" font-weight="650">这件事还没讲完什么</text>
      <text x="22" y="85" fill="#929CAA" font-size="16">经历 · 结果 · 思考 · 下一步</text>
    </g>

    <g transform="translate(260 156)">
      <rect width="252" height="96" rx="18" fill="#20242C" stroke="#9A78FF"/>
      <text x="22" y="31" fill="#BCA8FF" font-size="16" font-weight="750">02 · 方法层</text>
      <text x="22" y="64" fill="#F4F5F7" font-size="21" font-weight="650">这件事具体怎么完成</text>
      <text x="22" y="85" fill="#929CAA" font-size="16">流程 · 工具 · 决策 · 标准</text>
    </g>

    <g transform="translate(260 282)">
      <rect width="252" height="96" rx="18" fill="#20242C" stroke="#3370FF"/>
      <text x="22" y="31" fill="#79A5FF" font-size="16" font-weight="750">03 · 元方法层</text>
      <text x="22" y="64" fill="#F4F5F7" font-size="21" font-weight="650">这套方法是怎么找到的</text>
      <text x="22" y="85" fill="#929CAA" font-size="16">观察 · 比较 · 验证 · 调整</text>
    </g>
  </g>
</svg>
